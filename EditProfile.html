<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>Edit Profile - Recycling Lives</title>

    <link rel="icon" href="images/logoicon.svg" type="image/x-icon">

	<!-- Premium Fonts & CSS -->
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
	
	<!-- Custom Premium CSS -->
	<link rel="stylesheet" href="css/msc-premium.css">

	<script src="https://www.gstatic.com/firebasejs/8.7.0/firebase-app.js"></script>
	<script src="https://www.gstatic.com/firebasejs/8.7.0/firebase-database.js"></script>
	<script src="js/config.js"></script>

    <style>
        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(16, 185, 129, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.08) 0%, transparent 50%);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
        }

        .edit-container {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 1rem;
            position: relative;
        }

        .edit-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .back-btn {
            position: absolute;
            top: 2rem;
            left: 2rem;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            opacity: 0.7;
            transition: opacity 0.3s ease;
            font-weight: 500;
        }

        .back-btn:hover {
            opacity: 1;
            color: #fff;
        }

        .form-floating > .form-control {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 12px;
        }

        .form-floating > .form-control:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(16, 185, 129, 0.25);
        }

        .form-floating > label {
            color: var(--text-secondary);
        }

        .form-floating > .form-control:focus ~ label,
        .form-floating > .form-control:not(:placeholder-shown) ~ label {
            color: var(--primary-color);
            transform: scale(.85) translateY(-.5rem) translateX(.15rem);
        }
    </style>
</head>

<body>
	<a href="RestaurantCaterer.html" class="back-btn fade-in-up">
		<i class="bi bi-arrow-left"></i> Back to Dashboard
	</a>

	<div class="edit-container fade-in-up delay-1">
        <div class="edit-card">
            <div class="text-center mb-5">
                <i class="bi bi-person-lines-fill text-gradient mb-3" style="font-size: 3rem;"></i>
                <h2 class="fw-bold text-white mb-2">Edit <span class="text-gradient">Profile</span></h2>
                <p class="text-secondary small">Update your donor information and details</p>
            </div>

            <div class="row g-3">
                <div class="col-md-12">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="name" placeholder="Enter Name" required>
                        <label for="name">Full Name / Restaurant Name</label>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="region" placeholder="Region" required>
                        <label for="region">Region / Area</label>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-floating mb-3">
                        <input type="tel" class="form-control" id="number" placeholder="Phone" pattern="[7-9]{1}[0-9]{9}" title="Valid 10-digit number starting with 7-9" required>
                        <label for="number">Phone Number</label>
                    </div>
                </div>

                <div class="col-md-12">
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="email" placeholder="Email" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,3}$" required>
                        <label for="email">Email Address</label>
                    </div>
                </div>

                <div class="col-md-12">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="address" placeholder="Address" required>
                        <label for="address">Street Address</label>
                    </div>
                </div>

                <div class="col-md-5">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="city" placeholder="City" required>
                        <label for="city">City</label>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="State" placeholder="State" required>
                        <label for="State">State</label>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="zipcode" placeholder="Zip" pattern="[0-9]{6}" title="6 digit zip code" required>
                        <label for="zipcode">Zip Code</label>
                    </div>
                </div>

                <div class="col-md-12">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="mark" placeholder="Landmark">
                        <label for="mark">Any particular landmark (Optional)</label>
                    </div>
                </div>

                <div class="col-md-12">
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="password" placeholder="New Password">
                        <label for="password">Change Password (Optional)</label>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-3 mt-2">
                <button class="btn-glass w-50" onclick="window.location.href='RestaurantCaterer.html'" id="cancelBtn">
                    Cancel
                </button>
                <button class="btn-premium w-50" id="saveBtn">
                    Save Changes <i class="bi bi-check2-circle ms-2"></i>
                </button>
            </div>
        </div>
	</div>

	<!-- Javascript -->
    <script src="https://code.iconify.design/2/2.1.2/iconify.min.js"></script>
    <script src="js/rcEditProfile.js"></script>
</body>
</html>
