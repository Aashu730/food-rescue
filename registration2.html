<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Registration Step 2 - Recycling Lives</title>
    
    <link rel="icon" href="images/logoicon.svg" type="image/x-icon">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    
    <!-- Custom Premium CSS -->
    <link rel="stylesheet" href="css/msc-premium.css">

    <style>
        .registration-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
            position: relative;
        }

        .registration-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .back-btn {
            position: absolute;
            top: 2rem;
            left: 2rem;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        .back-btn:hover {
            opacity: 1;
            color: #fff;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .step-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--glass-border);
            transition: all 0.3s ease;
        }

        .step-dot.active {
            background: var(--primary-color);
            transform: scale(1.2);
            box-shadow: 0 0 10px var(--primary-color);
        }
        
        .step-dot.completed {
            background: var(--primary-color);
            opacity: 0.5;
        }
    </style>
</head>

<body class="bg-dark">
    <!-- Back Button -->
    <a href="registration.html" class="back-btn fade-in-up">
        <i class="bi bi-arrow-left"></i> Back to Step 1
    </a>

    <div class="registration-container fade-in-up delay-1">
        <div class="registration-card">
            <div class="text-center mb-4">
                <div class="step-indicator">
                    <div class="step-dot completed"></div>
                    <div class="step-dot active"></div>
                    <div class="step-dot"></div>
                </div>
                <h2 class="fw-bold text-white mb-2">Profile Setup for <span id="r" class="text-gradient"></span></h2>
                <script>document.getElementById("r").innerHTML = sessionStorage.getItem("role");</script>
                <p class="text-secondary small">Step 2 of 3: Organization Details</p>
            </div>

            <div class="mb-4">
                <input type="text" class="form-control form-input" id="name" placeholder="Enter Full Name / Organization Name" name="name" required>
            </div>

            <div class="mb-4">
                <input type="text" class="form-control form-input" id="region" placeholder="Enter Region (e.g. Gujarat)" name="region" required>
            </div>

            <button class="btn-premium w-100 mt-2" id="nxt">
                Continue to Delivery Info <i class="bi bi-arrow-right ms-2"></i>
            </button>
        </div>
    </div>

    <!-- Javascript -->
    <script>
        if (!sessionStorage.getItem("role")) {
            alert("Please fill up the first registration form!");
            window.location.href = "registration.html";
        } else {
            if (sessionStorage.getItem("username") != null) {
                document.getElementById("name").value = sessionStorage.getItem("username");
                document.getElementById("region").value = sessionStorage.getItem("region");
            }
            
            document.getElementById("nxt").onclick = async function () {
                var name = document.getElementById("name").value;
                var region = document.getElementById("region").value;
                
                if (name == "" || region == "") {
                    alert("Please fill up the entire form!");
                } else {
                    try {
                        var response = await fetch("api/validate.php?type=username&value=" + encodeURIComponent(name) + "&role=" + encodeURIComponent(sessionStorage.getItem("role")));
                        var data = await response.json();
                        if (data.exists) {
                            alert("Username/Organization Name already taken!");
                            return;
                        }

                        sessionStorage.setItem("username", name);
                        sessionStorage.setItem("region", region);
                        window.location.href = "registration3.html";
                    } catch (error) {
                        console.error(error);
                        alert("Unable to validate the username. Please try again later.");
                    }
                }
            }
        }
    </script>
</body>
</html>
