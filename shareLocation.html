<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Live Location - Recycling Lives</title>
    <link rel="icon" href="images/logoicon.svg" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/msc-premium.css">
    <script src="https://www.gstatic.com/firebasejs/8.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.7.0/firebase-database.js"></script>
    <script src="js/config.js"></script>
    <style>
        body {
            background-color: #070b1d;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .share-card {
            width: 100%;
            max-width: 520px;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 35px 80px rgba(0,0,0,0.25);
        }
        .share-card .form-control {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #f8fafc;
        }
        .share-card .form-control:focus {
            box-shadow: none;
            border-color: #10b981;
        }
        .small-note {
            color: #94a3b8;
        }
        .link-box {
            word-break: break-all;
            color: #38bdf8;
        }
    </style>
</head>
<body>
    <div class="share-card">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1">Driver Live Share</h2>
                <p class="small-note mb-0">Share your location for the assigned pickup into the live tracking map.</p>
            </div>
            <a href="index.html" class="btn btn-outline-light btn-sm"><i class="bi bi-x-lg"></i></a>
        </div>

        <div class="mb-3">
            <label class="form-label small text-uppercase text-secondary">Pickup Job ID</label>
            <input id="jobIdInput" type="text" class="form-control" placeholder="Enter job ID or use URL parameter">
            <div class="form-text small-note">This is the donation pickup job ID assigned by the NGO or dispatch team.</div>
        </div>

        <div class="mb-4">
            <button id="startShareBtn" class="btn btn-success w-100 mb-2">Start Sharing Location</button>
            <button id="stopShareBtn" class="btn btn-danger w-100" style="display:none;">Stop Sharing</button>
        </div>

        <div class="mb-3">
            <div id="shareStatus" class="fw-semibold">Ready to start.</div>
            <div id="lastCoordinates" class="small-note mt-2">Coordinates will appear here after sharing begins.</div>
        </div>

        <div class="mb-3">
            <div class="small-note">Live tracking URL for the requester:</div>
            <div id="liveUrl" class="link-box">trackPickup.html?jobId=<job_id></div>
            <button id="copyLinkBtn" class="btn btn-outline-info btn-sm mt-2">Copy Tracking Link</button>
        </div>
    </div>

    <script src="js/shareLocation.js"></script>
</body>
</html>
