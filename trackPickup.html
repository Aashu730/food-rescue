<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Track Pickup - Recycling Lives</title>

    <link rel="icon" href="images/logoicon.svg" type="image/x-icon">

    <!-- Premium Fonts & CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>

    <!-- Custom Premium CSS -->
    <link rel="stylesheet" href="css/msc-premium.css">

    <style>
        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(16, 185, 129, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.08) 0%, transparent 50%);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        .back-btn {
            position: absolute;
            top: 2rem;
            left: 2rem;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            opacity: 0.7;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .back-btn:hover {
            opacity: 1;
            color: #fff;
        }

        .tracking-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 5rem 1rem 2rem;
        }

        .map-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin-bottom: 2rem;
        }

        #map {
            height: 400px;
            width: 100%;
            z-index: 1;
        }

        .agent-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 2rem;
        }

        .agent-info {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .agent-avatar {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #fff;
        }

        .agent-details h3 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .agent-details p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
        }

        .btn-call {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-call:hover {
            background: var(--primary-color);
            color: #fff;
        }
    </style>
</head>

<body>
    <a href="RestaurantCaterer.html" class="back-btn fade-in-up">
        <i class="bi bi-arrow-left"></i> Back to Dashboard
    </a>

    <div class="tracking-container fade-in-up delay-1">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-white mb-2">Live <span class="text-gradient">Tracking</span></h2>
            <p class="text-secondary">Your assigned pickup driver is en route</p>
        </div>

        <div class="map-card">
            <div id="map"></div>
        </div>

        <div class="agent-card fade-in-up delay-2">
            <div class="agent-info">
                <div class="agent-avatar">
                    <i class="bi bi-person-fill"></i>
                </div>
                <div class="agent-details">
                    <h3 id="driverName">Loading...</h3>
                    <p><i class="bi bi-telephone-fill me-2"></i><span id="driverPhone">...</span></p>
                    <p id="liveStatus" class="text-secondary small mb-1">Waiting for live location...</p>
                    <p id="lastUpdate" class="text-secondary small">Last update: not available</p>
                    <p id="shareHint" class="text-info small mt-2"></p>
                    <p class="text-success mt-1 small fw-bold"><i class="bi bi-circle-fill me-1" style="font-size: 0.5rem;"></i> Active & On the way</p>
                </div>
            </div>
            <div class="action-buttons">
                <a href="#" id="callBtn" class="btn-call">
                    <i class="bi bi-telephone"></i> Call Agent
                </a>
                <button class="btn-premium" onclick="alert('Chat feature opening...')">
                    <i class="bi bi-chat-dots"></i> Message
                </button>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://www.gstatic.com/firebasejs/8.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.7.0/firebase-database.js"></script>
    <script src="js/config.js"></script>
    <!-- Custom Tracking JS -->
    <script src="js/trackPickup.js"></script>
</body>
</html>
