<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Create Food Post - Recycling Lives</title>
    
    <link rel="icon" href="images/logoicon.svg" type="image/x-icon">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    
    <!-- Custom Premium CSS -->
    <link rel="stylesheet" href="css/msc-premium.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.7.0/firebase-database.js"></script>
    <script src="js/config.js"></script>

    <style>
        .post-container {
            min-height: 100vh;
            padding: 100px 0 50px 0;
            position: relative;
        }

        .post-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .back-btn {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            opacity: 0.7;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        .back-btn:hover {
            opacity: 1;
            color: #fff;
        }
        
        .section-title {
            color: var(--primary-color);
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
            margin-top: 2rem;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 0.5rem;
        }
    </style>
</head>

<body class="bg-dark">
    <!-- Back Button -->
    <a href="feed.html" class="back-btn fade-in-up">
        <i class="bi bi-arrow-left"></i> Back to Feeds
    </a>

    <div class="post-container fade-in-up delay-1">
        <div class="post-card">
            <div class="text-center mb-5">
                <h2 class="fw-bold text-white mb-2">Create <span class="text-gradient">Food Post</span></h2>
                <p class="text-secondary small">Enter the details of the food you are donating</p>
            </div>

            <div class="section-title"><i class="bi bi-basket me-2"></i> Food Details</div>
            
            <div class="row g-4 mb-4">
                <div class="col-md-6">
                    <label class="text-secondary small mb-1">Quantity</label>
                    <input type="number" class="form-control form-input" id="quantity" placeholder="Number of dishes" required>
                </div>
                <div class="col-md-6">
                    <label class="text-secondary small mb-1">Type of Food</label>
                    <input type="text" class="form-control form-input" id="type" placeholder="e.g. Rice and Gravy" required>
                </div>
                <div class="col-md-4">
                    <label class="text-secondary small mb-1">Cooked Time</label>
                    <input type="time" class="form-control form-input" id="cooked_time" required>
                </div>
                <div class="col-md-4">
                    <label class="text-secondary small mb-1">Expiry (Hours)</label>
                    <input type="number" class="form-control form-input" id="expiry_time" placeholder="e.g. 5" required>
                </div>
                <div class="col-md-4">
                    <label class="text-secondary small mb-1">Hygiene Rating</label>
                    <input type="number" class="form-control form-input" id="hygiene" placeholder="1-5 Stars" value="5" min="1" max="5" required>
                </div>
            </div>

            <div class="section-title"><i class="bi bi-geo-alt me-2"></i> Pickup Location</div>
            
            <div class="mb-4">
                <input type="text" class="form-control form-input mb-3" id="address" placeholder="Street Address" required>
                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <input type="text" class="form-control form-input" id="city" placeholder="City" required>
                    </div>
                    <div class="col-md-4">
                        <input type="text" class="form-control form-input" id="State" placeholder="State" required>
                    </div>
                    <div class="col-md-4">
                        <input type="text" class="form-control form-input" id="zipcode" placeholder="Zip Code" pattern="[0-9]{6}" required>
                    </div>
                </div>
                <input type="text" class="form-control form-input" id="mark" placeholder="Any particular landmarks (optional)">
            </div>

            <button class="btn-premium w-100 mt-4 py-3" id="saveData" style="font-size: 1.1rem;">
                <i class="bi bi-cloud-arrow-up me-2"></i> Post Donation Live
            </button>
        </div>
    </div>

    <!-- Backend JS -->
    <script src="js/RestaurantPosting.js"></script>
</body>
</html>
